name: sekolah

description: Aplikasi Pengaduan Sarana SMP Negeri 3 Bantul

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  firebase_core: ^2.32.0
  firebase_auth: ^4.20.0
  cloud_firestore: ^4.17.5
  firebase_storage: ^11.7.7
  firebase_messaging: ^14.9.4
  flutter_local_notifications: ^17.0.0
  http: ^1.2.0
  image_picker: ^1.1.2
  pdf: ^3.11.3
  printing: ^5.13.1
  video_player: ^2.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - assets/logosmp3.jpg
    - assets/logosmp3.png
    - assets/background1.mp4
    - assets/animasi.mp4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/logosmp3.png"
  min_sdk_android: 21